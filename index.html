<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeaseCalc • Commercial Lease Commission Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    body { font-family: 'Inter', system_ui, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900">
  <div class="max-w-7xl mx-auto p-6">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-x-3">
        <div class="w-10 h-10 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-bold text-2xl">LC</div>
        <div>
          <h1 class="text-3xl font-semibold tracking-tight">LeaseCalc</h1>
          <p class="text-blue-600 text-sm">Commercial Lease Commission Calculator</p>
        </div>
      </div>
      <div class="flex items-center gap-x-4">
        <button onclick="saveDeal()" class="flex items-center gap-x-2 px-5 py-2.5 bg-white border border-slate-300 rounded-2xl text-sm font-medium hover:bg-slate-50">
          <i class="fa-solid fa-floppy-disk"></i>
          <span>Save Deal</span>
        </button>
        <button onclick="window.print()" class="flex items-center gap-x-2 px-5 py-2.5 bg-blue-600 text-white rounded-2xl text-sm font-medium hover:bg-blue-700">
          <i class="fa-solid fa-file-export"></i>
          <span>Export PDF</span>
        </button>
      </div>
    </div>

    <!-- Deal Details -->
    <div class="bg-white border border-slate-200 rounded-3xl p-8 shadow-sm mb-8">
      <h2 class="text-2xl font-semibold mb-6 flex items-center gap-x-2">
        <i class="fa-solid fa-building text-blue-600"></i>
        Deal Details
      </h2>

      <!-- Top Row -->
      <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
        <div class="min-h-[100px]">
          <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Square Footage</label>
          <div class="flex gap-x-3 items-center">
            <input type="number" id="sqft" value="0" class="flex-1 bg-slate-50 border border-slate-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-blue-500">
            <span class="text-slate-400 text-lg">sq ft</span>
          </div>
        </div>

        <div class="min-h-[100px]">
          <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Rent Quoted As</label>
          <select id="rent-quoted-as" onchange="updateRentLabel()" class="w-full bg-slate-50 border border-slate-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-blue-500 h-[60px]">
            <option value="sf">$/SF/Year</option>
            <option value="annual">Annual Quoted Rent</option>
          </select>
        </div>

        <div class="min-h-[100px]">
          <label id="rent-label" class="block text-xs uppercase tracking-widest text-slate-500 mb-2">$/SF/Year</label>
          <div class="flex gap-x-3 items-center">
            <span class="text-3xl text-slate-400">$</span>
            <input type="number" id="rent-amount" value="0" class="flex-1 bg-slate-50 border border-slate-300 rounded-2xl px-5 py-4 text-2xl font-medium focus:outline-none focus:border-blue-500">
          </div>
        </div>
      </div>

      <!-- Lease Term + Free Rent -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mt-6">
        <div>
          <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Lease Term (Years)</label>
          <input type="number" id="years" value="5" class="w-full bg-slate-50 border border-slate-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-blue-500">
        </div>
        <div class="flex items-center gap-x-3 pt-8">
          <input type="checkbox" id="include-free-rent" onchange="toggleFreeRent()" class="w-5 h-5 accent-blue-600">
          <label for="include-free-rent" class="text-slate-700 font-medium">Include Free Rent</label>
        </div>
      </div>

      <!-- Free Rent Fields -->
      <div id="free-rent-section" class="hidden mt-6 grid grid-cols-2 gap-6">
        <div>
          <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Free Rent Months</label>
          <input type="number" id="free-months" value="2" class="w-full bg-slate-50 border border-slate-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Extra Months</label>
          <input type="number" id="extra-months" value="0" class="w-full bg-slate-50 border border-slate-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <!-- Rent Structure -->
      <div class="mt-8 pt-6 border-t border-slate-200">
        <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Rent Structure</label>
        <select id="rent-structure" onchange="renderRentStructureInputs()" class="w-full bg-slate-50 border border-slate-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-blue-500">
          <option value="annual">Annual Escalations</option>
          <option value="flat">Flat Rent</option>
          <option value="every-n">Escalations Every N Years</option>
          <option value="flat-step">Flat Period + Step-Ups</option>
        </select>

        <div id="structure-inputs" class="mt-5 min-h-[140px]">
          <!-- Dynamic content injected by JS -->
        </div>
      </div>

      <!-- Commission Details -->
      <div class="mt-8 pt-6 border-t border-slate-200">
        <h3 class="text-lg font-semibold mb-4">Commission Details</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Commission Structure</label>
            <select id="commission-structure" onchange="renderCommissionInputs()" class="w-full bg-slate-50 border border-slate-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-blue-500">
              <option value="flat">Flat %</option>
              <option value="tiered">Tiered %</option>
            </select>
          </div>

          <!-- Flat Rate -->
          <div id="flat-rate-container" class="min-h-[140px] flex items-start pt-1">
            <div>
              <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Commission Rate</label>
              <div class="flex items-center gap-x-3">
                <input type="number" id="flat-rate" value="6" class="w-28 bg-slate-50 border border-slate-300 rounded-2xl px-5 py-4 text-2xl font-medium text-center focus:outline-none focus:border-blue-500">
                <span class="text-2xl text-slate-400">%</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Tiered Commission -->
        <div id="tiered-container" class="hidden mt-6">
          <div class="flex justify-between items-center mb-3">
            <label class="text-sm font-medium">Tiers</label>
            <button onclick="addTier()" class="flex items-center gap-x-1 text-blue-600 hover:text-blue-700 text-sm font-medium">
              <i class="fa-solid fa-plus"></i> Add Tier
            </button>
          </div>
          <div id="tiers-list" class="space-y-4">
            <!-- Tier rows injected by JS -->
          </div>
        </div>
      </div>

      <!-- Broker Splits -->
      <div class="mt-8 pt-8 border-t border-slate-200">
        <label class="block text-xs uppercase tracking-widest text-slate-500 mb-4">Broker Splits</label>
        <div class="grid grid-cols-2 gap-8">
          <div class="flex items-center justify-between">
            <span class="text-slate-700">Your side</span>
            <input type="number" id="your-side" value="50" class="w-20 text-center bg-slate-50 border border-slate-300 rounded-2xl px-4 py-2">%
          </div>
          <div class="flex items-center justify-between">
            <span class="text-slate-700">Personal split</span>
            <input type="number" id="agent-split" value="50" class="w-20 text-center bg-slate-50 border border-slate-300 rounded-2xl px-4 py-2">%
          </div>
        </div>
      </div>

      <button onclick="calculate()" class="mt-10 w-full lg:w-auto bg-blue-600 hover:bg-blue-700 text-white px-10 py-4 rounded-2xl font-semibold flex items-center justify-center gap-x-2 text-lg">
        <i class="fa-solid fa-calculator"></i>
        CALCULATE NOW
      </button>
    </div>

    <!-- Results -->
    <div id="results-panel" class="hidden bg-white border border-slate-200 rounded-3xl p-8 shadow-sm mb-8">
      <!-- Populated by JavaScript -->
    </div>

    <!-- Saved Deals -->
    <div id="saved-deals-section" class="hidden">
      <h2 class="text-lg font-semibold mb-4">Saved Deals</h2>
      <div id="saved-deals-list" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Populated by JavaScript -->
      </div>
    </div>
  </div>

  <script>
    // ==================== JAVASCRIPT ====================

    function updateRentLabel() {
      const type = document.getElementById('rent-quoted-as').value;
      document.getElementById('rent-label').innerText = (type === 'sf') ? '$/SF/Year' : 'Annual Quoted Rent';
    }

    function toggleFreeRent() {
      const section = document.getElementById('free-rent-section');
      section.classList.toggle('hidden', !document.getElementById('include-free-rent').checked);
    }

    function renderRentStructureInputs() {
      const container = document.getElementById('structure-inputs');
      const type = document.getElementById('rent-structure').value;
      container.innerHTML = '';

      if (type === 'annual') {
        container.innerHTML = `
          <div>
            <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Annual Escalation %</label>
            <div class="flex">
              <input type="number" id="annual-escalation" value="3" class="flex-1 bg-slate-50 border border-slate-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-blue-500">
              <span class="bg-slate-100 border border-l-0 border-slate-300 rounded-r-2xl px-6 flex items-center text-slate-400">%</span>
            </div>
          </div>
        `;
      } else if (type === 'every-n') {
        container.innerHTML = `
          <div class="grid grid-cols-2 gap-6">
            <div>
              <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Escalation %</label>
              <div class="flex">
                <input type="number" id="annual-escalation" value="3" class="flex-1 bg-slate-50 border border-slate-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-blue-500">
                <span class="bg-slate-100 border border-l-0 border-slate-300 rounded-r-2xl px-6 flex items-center text-slate-400">%</span>
              </div>
            </div>
            <div>
              <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Every N Years</label>
              <input type="number" id="escalation-frequency" value="3" class="w-full bg-slate-50 border border-slate-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-blue-500">
            </div>
          </div>
        `;
      } else if (type === 'flat-step') {
        container.innerHTML = `
          <div class="grid grid-cols-3 gap-6">
            <div>
              <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Flat for first</label>
              <input type="number" id="flat-years" value="3" class="w-full bg-slate-50 border border-slate-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-blue-500">
              <span class="text-xs text-slate-400 mt-1 block">years</span>
            </div>
            <div>
              <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Then escalation %</label>
              <div class="flex">
                <input type="number" id="annual-escalation" value="3" class="flex-1 bg-slate-50 border border-slate-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-blue-500">
                <span class="bg-slate-100 border border-l-0 border-slate-300 rounded-r-2xl px-6 flex items-center text-slate-400">%</span>
              </div>
            </div>
            <div>
              <label class="block text-xs uppercase tracking-widest text-slate-500 mb-2">Step every</label>
              <input type="number" id="step-frequency" value="3" class="w-full bg-slate-50 border border-slate-300 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-blue-500">
              <span class="text-xs text-slate-400 mt-1 block">years</span>
            </div>
          </div>
        `;
      }
    }

    function renderCommissionInputs() {
      const tieredContainer = document.getElementById('tiered-container');
      const flatContainer = document.getElementById('flat-rate-container');

      if (document.getElementById('commission-structure').value === 'tiered') {
        flatContainer.classList.add('hidden');
        tieredContainer.classList.remove('hidden');
        if (tiers.length === 0) tiers = [{ from: 1, to: 5, rate: 6 }];
        renderTiers();
      } else {
        flatContainer.classList.remove('hidden');
        tieredContainer.classList.add('hidden');
      }
    }

    let tiers = [{ from: 1, to: 5, rate: 6 }];

    function renderTiers() {
      const container = document.getElementById('tiers-list');
      container.innerHTML = '';

      tiers.forEach((tier, index) => {
        const div = document.createElement('div');
        div.className = `flex gap-4 items-end bg-slate-50 p-4 rounded-2xl`;
        div.innerHTML = `
          <div class="flex-1">
            <label class="block text-xs text-slate-500 mb-1">From Year</label>
            <input type="number" value="${tier.from}" class="w-full bg-white border border-slate-300 rounded-2xl px-4 py-3" onchange="updateTier(${index}, 'from', this.value)">
          </div>
          <div class="flex-1">
            <label class="block text-xs text-slate-500 mb-1">To Year</label>
            <input type="number" value="${tier.to}" class="w-full bg-white border border-slate-300 rounded-2xl px-4 py-3" onchange="updateTier(${index}, 'to', this.value)">
          </div>
          <div class="w-28">
            <label class="block text-xs text-slate-500 mb-1">Rate %</label>
            <input type="number" value="${tier.rate}" class="w-full bg-white border border-slate-300 rounded-2xl px-4 py-3" onchange="updateTier(${index}, 'rate', this.value)">
          </div>
          <button onclick="removeTier(${index})" class="text-red-500 hover:text-red-600 mb-1">
            <i class="fa-solid fa-trash"></i>
          </button>
        `;
        container.appendChild(div);
      });
    }

    function updateTier(index, field, value) {
      tiers[index][field] = Number(value);
    }

    function addTier() {
      const last = tiers[tiers.length - 1];
      tiers.push({ from: last.to + 1 || 1, to: 0, rate: 6 });
      renderTiers();
    }

    function removeTier(index) {
      if (tiers.length === 1) return;
      tiers.splice(index, 1);
      renderTiers();
    }

    function calculate() {
      alert('Calculation logic will be added in the next step!');
    }

    function saveDeal() {
      alert('Save deal logic will be added in the next step!');
    }

    // Initialize
    function init() {
      renderRentStructureInputs();
      renderCommissionInputs();
      console.log('%c[LeaseCalc v3] Initialized successfully', 'color:#3b82f6');
    }

    window.onload = init;
  </script>
</body>
</html>
